<div #screen>
  <nav class="navbar navbar-dark bg-primary" id="nav-div" *ngIf="sessionService.isUserInSystem">
    <div class="navbar-container">
      <!-- Logo/Title Section -->
      <div class="navbar-brand">
        <span class="brand-icon">
          <i class="pi pi-file-invoice"></i>
        </span>
        <span class="title">
          EZInvoice
        </span>
      </div>

      <!-- Right Section -->
      <div class="nav-right">
        <!-- Hamburger menu button (visible on mobile only) -->
        <button class="hamburger-btn mobile-only" (click)="toggleSidebar()" aria-label="Toggle menu" type="button">
          <i class="pi pi-bars"></i>
        </button>

        <!-- Screenshot Button -->
        <button class="action-btn screenshot-btn" (click)="capture()" aria-label="Take screenshot" type="button"
          title="Take Screenshot">
          <i class="pi pi-camera"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Desktop TabMenu (hidden on mobile) -->
  <p-menubar [model]="items" id="ul-div" class="desktop-menu" *ngIf="sessionService.isUserInSystem"></p-menubar>
  <!-- Mobile Sidebar Menu -->
  <p-drawer [(visible)]="sidebarVisible" position="left" [modal]="true" [dismissible]="true" [showCloseIcon]="true"
    styleClass="mobile-sidebar" *ngIf="sessionService.isUserInSystem">
    <ng-template pTemplate="header">
      <h3 style="margin: 0; font-weight: 600;">Menu</h3>
    </ng-template>
    <p-menu [model]="items" [style]="{'width': '100%', 'border': 'none'}" styleClass="mobile-menu-items"></p-menu>
  </p-drawer>
