<div class="register-card">
  <h2 class="title">Register Company / User</h2>

  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="grid">
      <div class="col">
        <label>Company Name *</label>
        <input type="text" formControlName="companyName" [class.invalid]="isInvalid('companyName')" />
        <small class="error" *ngIf="isInvalid('companyName')">Company name is required (max 100 chars).</small>

        <label>Company GSTIN</label>
        <input type="text" formControlName="companyGSTIN" />

        <label>PAN</label>
        <input type="text" formControlName="pan" />

        <label>Owner / Contact Person *</label>
        <input type="text" formControlName="ownerName" [class.invalid]="isInvalid('ownerName')" />
        <small class="error" *ngIf="isInvalid('ownerName')">Owner name is required.</small>

        <label>Mobile *</label>
        <input type="text" formControlName="mobile" [class.invalid]="isInvalid('mobile')" />
        <small class="error" *ngIf="isInvalid('mobile')">Enter a valid 10-digit mobile number.</small>

        <label>Email</label>
        <input type="email" formControlName="email" [class.invalid]="isInvalid('email')" />
        <small class="error" *ngIf="isInvalid('email')">Enter a valid email address.</small>
      </div>

      <div class="col">
        <label>House No / Address</label>
        <input type="text" formControlName="houseNo" />

        <label>Area / Locality</label>
        <input type="text" formControlName="area" />

        <label>Landmark</label>
        <input type="text" formControlName="landMark" />

        <label>City</label>
        <input type="text" formControlName="city" />

        <label>PIN</label>
        <input type="text" formControlName="pin" [class.invalid]="isInvalid('pin')" />
        <small class="error" *ngIf="isInvalid('pin')">PIN should be 6 digits.</small>

        <div class="row small">
          <div>
            <label>State</label>
            <input type="text" formControlName="state" />
          </div>
          <div>
            <label>State Code</label>
            <input type="text" formControlName="stateCode" />
          </div>
        </div>

        <label>Country</label>
        <input type="text" formControlName="country" />

        <!-- <label>Active</label>
        <input type="checkbox" formControlName="isActive" /> -->
      </div>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="submitting">{{ submitting ? 'Submitting...' : 'Register' }}</button>
      <button type="button" class="secondary" (click)="registerForm.reset({ country: 'India', isActive: true })" [disabled]="submitting">Reset</button>
    </div>
  </form>
</div>
